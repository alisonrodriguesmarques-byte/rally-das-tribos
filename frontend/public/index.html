<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030e1c">
  <title>Rally das Tribos</title>
  <link rel="icon" href="./img/icone.svg" type="image/svg+xml">
  <script src="/js/tema-inicial.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="pular-conteudo" href="#app">Pular para o conteúdo</a>
  <aside id="lateral" class="lateral" hidden aria-label="Navegação principal"></aside>
  <header id="topo" class="topo" hidden>
    <button id="btn-voltar" class="topo__voltar" aria-label="Voltar" hidden>&#8592;</button>
    <div class="topo__titulo">
      <strong id="topo-titulo">Rally das Tribos</strong>
      <small id="topo-rally"></small>
    </div>
    <div class="topo__acoes"><button type="button" class="tema-botao" data-alternar-tema aria-label="Ativar tema claro"></button><button id="btn-rally" class="topo__acao" aria-label="Trocar rally" type="button"><span class="trocar-rally-rotulo">Trocar rally</span><svg class="trocar-rally-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
  </header>
  <button type="button" id="tema-publico" class="tema-botao tema-publico" data-alternar-tema aria-label="Ativar tema claro"></button>
  <main id="app" tabindex="-1" class="conteudo" aria-live="polite"></main>
  <nav id="nav" class="nav" hidden></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
